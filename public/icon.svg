<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Logo Graphics: Two connected people + Pin -->
  <g transform="translate(256, 230)">
    <!-- Left Person (Blue) -->
    <circle cx="-70" cy="-55" r="30" fill="url(#blueGrad)"/>
    <path d="M-115,35 C-115,-10 -95,-25 -70,-25 C-55,-25 -42,-18 -36,-5 C-45,10 -45,25 -40,35 Z" fill="url(#blueGrad)"/>

    <!-- Right Person (Green) -->
    <circle cx="70" cy="-55" r="30" fill="url(#greenGrad)"/>
    <path d="M115,35 C115,-10 95,-25 70,-25 C55,-25 42,-18 36,-5 C45,10 45,25 40,35 Z" fill="url(#greenGrad)"/>

    <!-- Center Connection / Location Pin -->
    <path d="M0,-30 C-22,-30 -40,-12 -40,10 C-40,35 0,75 0,75 C0,75 40,35 40,10 C40,-12 22,-30 0,-30 Z" fill="#FFFFFF" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
    <circle cx="0" cy="8" r="14" fill="#0F2942"/>
    <circle cx="0" cy="8" r="7" fill="#10B981"/>
  </g>

  <!-- App Name Text -->
  <text x="256" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    WASTA <tspan fill="#10B981">NO</tspan>
  </text>
  <text x="256" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
    FÈS • MEKNÈS • MAROC
  </text>
</svg>
